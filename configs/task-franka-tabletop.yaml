# Franka tabletop benchmark. The phase bundle is hidden; this file only names it.
# Public play ids use the same task module with seeds shipped in the package.

task_name: "Nepher-FrankaTabletop-Envhub-Play-v0"
task_module: "franka_tabletop.tasks"
task_type: "manipulation.multitask"
scoring_version: "v1"
category: "manipulation"
runtime: brain
benchmark_env_id: "franka-tabletop-v0"
enable_cameras: true
verify_canary: true

env_config:
  cfg_entry: "franka_tabletop.env_cfg:build_cfg"

seeds:
  - 1

num_episodes: 1
max_episode_steps: 600
max_episode_time_s: 40.0

log_dir: "logs/franka-tabletop"
enable_logging: false

brain:
  socket_dir: "/run/brain"
  step_timeout_s: 60
  open_loop_horizon: 8
