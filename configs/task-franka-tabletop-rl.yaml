# Evaluation configuration for task-franka-tabletop-rl
#
# Runs the classical high-level planner, the learned end-effector tracker, and IK on the 16 Franka
# tabletop tasks of the franka-tabletop-rl-v0 EnvHub bundle. Each env_scene names one task id,
# and num_envs jittered layouts of that task run in parallel. The tracker checkpoint is
# best_policy/best_policy.pt in the task project. Scores are not comparable with the brain
# benchmarks (v11-v13): they use the in-process runner and manipulation.multitask.rl scoring.

task_name: "Nepher-FrankaTabletopRL-HL-EnvhubPlay-v0"
task_module: "franka_tabletop_rl"
category: "manipulation"
task_type: "manipulation.multitask.rl"
scoring_version: "v1"

env_scenes:
  - { env_id: "franka-tabletop-rl-v0", scene: "animals_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "apple_and_yogurt_in_bowl" }
  - { env_id: "franka-tabletop-rl-v0", scene: "bigger_object" }
  - { env_id: "franka-tabletop-rl-v0", scene: "blocks_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "clamp_in_right_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "cubes_and_blocks_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "foodpacking_1bin_1can" }
  - { env_id: "franka-tabletop-rl-v0", scene: "foodpacking_1bin_3can" }
  - { env_id: "franka-tabletop-rl-v0", scene: "red_dishes_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "red_items_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "rubiks_cubes_in_bin" }
  - { env_id: "franka-tabletop-rl-v0", scene: "smaller_object" }
  - { env_id: "franka-tabletop-rl-v0", scene: "throw_away_apple" }
  - { env_id: "franka-tabletop-rl-v0", scene: "throw_away_snacks" }
  - { env_id: "franka-tabletop-rl-v0", scene: "tool_organization" }
  - { env_id: "franka-tabletop-rl-v0", scene: "wood_spatula_to_bowl" }

seeds:
  - 1

num_episodes: 1
num_envs: 16
max_episode_steps: 600
max_episode_time_s: 40.0

workflow: "rsl_rl"
policy_path: "default"

enable_cameras: false
log_dir: "logs/franka-tabletop-rl"
enable_logging: false
timeout_seconds: null
