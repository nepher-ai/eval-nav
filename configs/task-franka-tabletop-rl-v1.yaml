# Evaluation configuration for franka-tabletop-rl-v1.
#
# One stage holds all 120 tasks and one background. num_envs is a multiple of 120, so every
# task runs in the same step. Upright tasks run and score 0. The tracker checkpoint is
# best_policy/best_policy.pt in the task project.

task_name: "Nepher-FrankaTabletopRL-HL-EnvhubPlay-v0"
task_module: "franka_tabletop_rl"
category: "manipulation"
task_type: "manipulation.multitask.rl"
scoring_version: "v1"

env_scenes:
  - { env_id: "franka-tabletop-rl-v1", scene: "all" }

seeds:
  - 1

num_episodes: 1
num_envs: 120
max_episode_steps: 600
max_episode_time_s: 80.0

workflow: "rsl_rl"
policy_path: "default"

enable_cameras: false
log_dir: "logs/franka-tabletop-rl-v1"
enable_logging: false
timeout_seconds: null
