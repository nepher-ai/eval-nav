# Evaluation configuration for leatherback-realmaze-v3
#
# 90 larger mixed mazes (circle / organic / enclosed), disjoint from v2.
# Same navigation.leatherback v2 scoring formula as the maze tournament.
#
# Prerequisites:
#   1. EnvHub can resolve ``leatherback-realmaze-v3`` (nepher download/cache).
#   2. Install leatherback_lidar: pip install -e task-leatherback-realmaze-winner/source/leatherback_lidar
#   3. Install nepher (envhub):   pip install -e envhub

task_name: "Nepher-Leatherback-Lidar-Maze-Envhub-Play-v0"
task_module: "leatherback_lidar"

env_scenes:
  - env_id: "leatherback-realmaze-v3"
    scene: 0

seeds:
  - 42

# One parallel env per maze tile
num_envs: 90

num_episodes: 1

# Episode length matches the PLAY config (300 s at 15 Hz = 4500 steps)
max_episode_steps: 4500
max_episode_time_s: 300.0

# Scorer: leatherback maze navigation, version 2 (SR × quality)
task_type: "navigation.leatherback"
scoring_version: "v2"

log_dir: "logs/leatherback-lidar-maze-v3"
enable_logging: true
timeout_seconds: null
policy_path: "default"
